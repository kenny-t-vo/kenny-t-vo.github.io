<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kenny vo, cv.</title>
<meta name="description" content="curriculum vitae, august 2026.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="kenny vo, cv.">
<meta property="og:description" content="curriculum vitae, august 2026.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23fff'/><rect x='6' y='7' width='9' height='18' fill='%230000ee'/><rect x='17' y='7' width='9' height='18' fill='%230000ee'/></svg>">
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/redaction-35-400.woff2" crossorigin>
<link rel="preload" as="image" href="pages/1.webp">
<link rel="stylesheet" href="../assets/type.css?v=13">
<link rel="stylesheet" href="../assets/style.css?v=13">
<style>
  /* laid out from pages.js: any page count, aspect follows the pdf.
     height is the smaller of what the window and the width allow, so
     sizing needs no script. */
  .sheet{
    --pad-x:calc(var(--frame) * 1.6);
    --pad-y:calc(var(--frame) * 2.4);
    display:flex;
    aspect-ratio:var(--ar, 1.545);
    height:min(calc(100svh - 2 * var(--pad-y)),
               calc((100vw - 2 * var(--pad-x)) / var(--ar, 1.545)));
    background:var(--bg);
    box-shadow:0 0 0 1px var(--page-edge);
    position:relative;
  }
  .sheet .page{
    position:relative;
    flex:1 1 0;
    min-width:0;
    height:100%;
  }
  .sheet .page img{ display:block; width:100%; height:100%; object-fit:fill; }

  /* the same crease the photography book gets, in place of a hard line;
     strength comes from --gutter-strength on <body data-book="cv"> */
  .sheet::after{
    content:"";
    position:absolute; top:0; bottom:0; left:50%;
    width:var(--gutter-width);
    transform:translateX(-50%);
    pointer-events:none;
    background:linear-gradient(90deg,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,calc(.055 * var(--gutter-strength))) 42%,
      rgba(0,0,0,calc(.100 * var(--gutter-strength))) 49.6%,
      rgba(0,0,0,calc(.110 * var(--gutter-strength))) 50.4%,
      rgba(0,0,0,calc(.055 * var(--gutter-strength))) 58%,
      rgba(0,0,0,0) 100%);
  }

  /* upright windows: stack and scroll */
  @media (max-aspect-ratio:1/1){
    .stage{ overflow-y:auto; align-items:flex-start; }
    .sheet{
      flex-direction:column;
      gap:var(--s2);
      aspect-ratio:auto;
      height:auto;
      width:min(calc(100vw - 2 * var(--pad-x)), 520px);
      background:none;
      box-shadow:none;
    }
    .sheet::after{ display:none; }        /* stacked: there is no gutter */
    .sheet .page{ height:auto; box-shadow:0 0 0 1px var(--page-edge); background:var(--bg); }
    .sheet .page img{ height:auto; }
  }
</style>
</head>
<body data-book="cv">

<main id="stage" class="stage" aria-label="curriculum vitae.">
  <div class="sheet" id="sheet"></div>
</main>

<header class="bar bar--top">
  <a class="wordmark invert" href="../">kenny vo.</a>
  <span class="here">cv.</span>
</header>

<footer class="bar bar--bottom">
  <div class="tools">
    <a class="tool invert" href="Vo_Kenny_CV.pdf" download>pdf.</a>
  </div>
  <a class="tool invert" id="close" href="../">close.</a>
</footer>

<script src="pages.js?v=13"></script>
<script>
(() => {
  const CV = window.CV || { pages: 0, aspect: 0.7725, links: {} };
  const sheet = document.getElementById('sheet');

  sheet.style.setProperty('--ar', (CV.pages * CV.aspect).toFixed(4));

  for (let n = 1; n <= CV.pages; n++) {
    const page = document.createElement('div');
    page.className = 'page';

    const img = new Image();
    img.src = `pages/${n}.webp`;
    img.alt = `curriculum vitae, page ${n}.`;
    img.decoding = 'async';
    page.append(img);

    /* link overlays from the pdf */
    for (const L of (CV.links && CV.links[String(n)]) || []) {
      const a = document.createElement('a');
      a.className = 'pin';
      a.href = L.href;
      a.title = L.href.replace(/^mailto:/, '');
      a.setAttribute('aria-label', a.title);
      if (/^https?:/i.test(L.href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      /* url() in a custom property resolves against the stylesheet, not the
         page, so hand it an absolute one */
      if (L.chip) a.style.setProperty('--chip', `url(${new URL(L.chip, location.href).href})`);
      a.style.left   = L.x * 100 + '%';
      a.style.top    = L.y * 100 + '%';
      a.style.width  = L.w * 100 + '%';
      a.style.height = L.h * 100 + '%';
      page.append(a);
    }
    sheet.append(page);
  }

  /* esc goes back, or to the index if the page was opened cold */
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (history.length > 1) history.back();
    else location.href = '../';
  });
})();
</script>
</body>
</html>
