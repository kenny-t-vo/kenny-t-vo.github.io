<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kenny vo, cv.</title>
<meta name="description" content="curriculum vitae, august 2026.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="kenny vo, cv.">
<meta property="og:description" content="curriculum vitae, august 2026.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23fff'/><rect x='6' y='7' width='9' height='18' fill='%230000ee'/><rect x='17' y='7' width='9' height='18' fill='%230000ee'/></svg>">
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/redaction-35-400.woff2" crossorigin>
<link rel="preload" as="image" href="pages/1.webp">
<link rel="stylesheet" href="../assets/type.css?v=9">
<link rel="stylesheet" href="../assets/style.css?v=9">
<style>
  /* The sheet is laid out from pages.js, so a cv of any length works and the
     page's aspect follows the pdf. Height is the smaller of what the window
     allows and what the width allows — no script needed for the sizing. */
  .sheet{
    --pad-x:calc(var(--frame) * 1.6);
    --pad-y:calc(var(--frame) * 2.4);
    display:flex;
    aspect-ratio:var(--ar, 1.545);
    height:min(calc(100svh - 2 * var(--pad-y)),
               calc((100vw - 2 * var(--pad-x)) / var(--ar, 1.545)));
    background:var(--bg);
    box-shadow:0 0 0 1px var(--page-edge);
  }
  .sheet .page{
    position:relative;
    flex:1 1 0;
    min-width:0;
    height:100%;
  }
  .sheet .page img{ display:block; width:100%; height:100%; object-fit:fill; }
  /* separate sheets, not a designed spread: mark each join */
  .sheet .page + .page{ box-shadow:-1px 0 0 0 var(--page-edge); }

  /* upright windows: stack the pages and let them scroll */
  @media (max-aspect-ratio:1/1){
    .stage{ overflow-y:auto; align-items:flex-start; }
    .sheet{
      flex-direction:column;
      gap:var(--s2);
      aspect-ratio:auto;
      height:auto;
      width:min(calc(100vw - 2 * var(--pad-x)), 520px);
      background:none;
      box-shadow:none;
    }
    .sheet .page{ height:auto; box-shadow:0 0 0 1px var(--page-edge); background:var(--bg); }
    .sheet .page + .page{ box-shadow:0 0 0 1px var(--page-edge); }
    .sheet .page img{ height:auto; }
  }
</style>
</head>
<body data-book="cv">

<main id="stage" class="stage" aria-label="curriculum vitae.">
  <div class="sheet" id="sheet"></div>
</main>

<header class="bar bar--top">
  <a class="wordmark" href="../">kenny vo.</a>
  <span class="here">cv.</span>
</header>

<footer class="bar bar--bottom">
  <div class="tools">
    <a class="tool" href="Vo_Kenny_CV.pdf" download>pdf.</a>
  </div>
  <a class="tool" id="close" href="../">close.</a>
</footer>

<script src="pages.js?v=9"></script>
<script>
(() => {
  const CV = window.CV || { pages: 0, aspect: 0.7725, links: {} };
  const sheet = document.getElementById('sheet');

  sheet.style.setProperty('--ar', (CV.pages * CV.aspect).toFixed(4));

  for (let n = 1; n <= CV.pages; n++) {
    const page = document.createElement('div');
    page.className = 'page';

    const img = new Image();
    img.src = `pages/${n}.webp`;
    img.alt = `curriculum vitae, page ${n}.`;
    img.decoding = 'async';
    page.append(img);

    /* the pdf's own hyperlinks, laid back over the rasterised page */
    for (const L of (CV.links && CV.links[String(n)]) || []) {
      const a = document.createElement('a');
      a.className = 'pin';
      a.href = L.href;
      a.setAttribute('aria-label', L.href.replace(/^mailto:/, ''));
      if (/^https?:/i.test(L.href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      a.style.left   = L.x * 100 + '%';
      a.style.top    = L.y * 100 + '%';
      a.style.width  = L.w * 100 + '%';
      a.style.height = L.h * 100 + '%';
      page.append(a);
    }
    sheet.append(page);
  }

  /* esc closes it the way the back button would: return where you came from,
     and fall back to the index if this page was opened cold. */
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (history.length > 1) history.back();
    else location.href = '../';
  });
})();
</script>
</body>
</html>
