<style>
  /* Two fixed pages, so the spread is sized in CSS — height is the smaller of
     what the window allows and what the width allows. No script, no controls. */
  .sheet{
    --ar:1.5450;                                  /* two letter leaves */
    --pad-x:calc(var(--frame) * 1.6);
    --pad-y:calc(var(--frame) * 2.4);
    display:flex;
    aspect-ratio:var(--ar);
    height:min(calc(100svh - 2 * var(--pad-y)),
               calc((100vw - 2 * var(--pad-x)) / var(--ar)));
    background:var(--bg);
    box-shadow:0 0 0 1px var(--page-edge);
  }
  .sheet img{ display:block; width:50%; height:100%; object-fit:fill; }
  /* two separate sheets, not a designed spread: mark the join.
     box-shadow paints outside the box, so it adds no width. */
  .sheet img:first-child{ box-shadow:1px 0 0 0 var(--page-edge); }

  /* upright windows: stack the two pages and let them scroll */
  @media (max-aspect-ratio:1/1){
    .stage{ overflow-y:auto; align-items:flex-start; }
    .sheet{
      flex-direction:column;
      gap:var(--s2);
      aspect-ratio:auto;
      height:auto;
      width:min(calc(100vw - 2 * var(--pad-x)), 520px);
      background:none;
      box-shadow:none;              /* the hairline moves onto each page */
    }
    /* :first-child outranks .sheet img, so the join rule has to be undone
       explicitly or the top page keeps only its right-hand hairline */
    .sheet img, .sheet img:first-child{
      width:100%; height:auto;
      background:var(--bg);
      box-shadow:0 0 0 1px var(--page-edge);
    }
  }
</style>
</head>

<script>
  /* esc closes it the way the back button would: return where you came from,
     and fall back to the index if this page was opened cold. */
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (history.length > 1) history.back();
    else location.href = '../';
  });
</script>
