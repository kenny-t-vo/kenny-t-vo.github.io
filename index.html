<style>
:root{
  --bg:#fff;
  --fg:#111;
  --dim:#6f6f6f;
  --faint:#9a9a9a;
  --rule:#dcdcdc;
  --rule2:#111;
  --wash:#f2f2f7;

  /* blue = a book you can open, purple = one you have opened */
  --blue:#0000ee;
  --purple:#551a8b;

  --serif:"Times New Roman",Times,"Liberation Serif",
          "Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;

  --t1:30px;    /* the single large element */
  --t2:18px;    /* book titles */
  --t3:14px;    /* prose */
  --t4:12.5px;  /* secondary copy */
  --t5:11px;    /* numeric data */
  --t6:10.5px;  /* labels */

  --leaf:84px;  /* filmstrip height — not a type step */
}

*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--bg); color:var(--fg);
  font:var(--t3)/1.45 var(--serif);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:clamp(30px,7vh,72px) clamp(20px,6vw,56px);
}
a{ color:var(--blue); text-decoration:underline; text-underline-offset:2px; }
a:visited{ color:var(--purple); }
::selection{ background:var(--blue); color:#fff; }

.sheet{ width:min(680px,100%); margin:0 auto; }

/* cap height seated on the top margin, not the box top:
   offset = halfLeading + (ascent - capHeight) = .201em for Times at 1.06 */
h1{
  font-size:var(--t1); font-weight:400; line-height:1.06;
  letter-spacing:-.018em; margin:-0.201em 0 6px;
}
.standfirst{ font-size:var(--t4); color:var(--dim); margin-bottom:clamp(26px,5vh,44px); }

.lbl{
  display:block; font-size:var(--t6); line-height:1;
  letter-spacing:.09em; color:var(--faint); margin-bottom:7px;
}

hr{ border:0; border-top:1px solid var(--rule2); }
hr.hair{ border-top-color:var(--rule); }

.entry{ padding:15px 0 17px; }

/* both edges are promises: words flush left, figures flush right */
.line{
  display:grid; grid-template-columns:1fr auto;
  align-items:baseline; gap:14px;
}
.line + .line{ margin-top:2px; }
.name{ font-size:var(--t2); line-height:1.2; }
.desc{ font-size:var(--t4); color:var(--dim); }
.fig{
  font:var(--t5)/1.5 var(--mono);
  font-variant-numeric:tabular-nums; color:var(--dim);
  white-space:nowrap;
}

/* the one accent move: invert the book you are about to open */
/* shrink-wrap the link, or the inversion paints the whole grid cell */
a.name{ justify-self:start; text-decoration-thickness:1px; }
a.name:hover, a.name:focus-visible{
  background:var(--blue); color:#fff;
  text-decoration:none; outline:none;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  padding:0 .16em; margin:0 -.16em;
}

.strip{ display:flex; gap:6px; margin-top:13px; }
.strip a{
  display:block; line-height:0;
  border:1px solid var(--rule); background:var(--wash);
  height:var(--leaf); aspect-ratio:.77266;
}
.strip img{ width:100%; height:100%; object-fit:fill; }
.strip a:hover, .strip a:focus-visible{ border-color:var(--blue); outline:none; }

footer{ margin-top:clamp(22px,4vh,36px); font-size:var(--t4); color:var(--dim); }

@media (max-width:520px){
  :root{ --leaf:64px; }
  .strip{ gap:5px; }
}
@media (max-height:560px){
  body{ padding-top:24px; padding-bottom:24px; }
  .strip{ display:none; }        /* the least important block goes first */
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

  <hr>

      <a href="work/#p3"><img src="work/pages/thumb/03.webp" alt="page 3" loading="lazy" width="320" height="414"></a>
