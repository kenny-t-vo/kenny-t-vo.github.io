<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenny Vo — Photography</title>
<meta name="description" content="A photographic archive. 32 pages, read as spreads.">
<meta name="theme-color" content="#101010">
<meta property="og:title" content="Kenny Vo — Photography">
<meta property="og:description" content="A photographic archive. 32 pages, read as spreads.">
<meta property="og:type" content="website">
<meta property="og:image" content="pages/social.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23101010'/><rect x='6' y='7' width='9' height='18' fill='%23f2f0ec'/><rect x='17' y='7' width='9' height='18' fill='%23f2f0ec'/></svg>">

</head>
<body>

<main id="stage" class="stage" aria-label="Portfolio pages">
  <div id="book" class="book" role="group" aria-live="polite"></div>
</main>

<button class="edge edge--prev" id="prev" aria-label="Previous page">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8"/></svg>
</button>
<button class="edge edge--next" id="next" aria-label="Next page">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
</button>

<header class="bar bar--top">
  <span class="title">Kenny&nbsp;Vo <em>photographic archive</em></span>
</header>

<footer class="bar bar--bottom">
  <button id="grid-btn" class="btn" aria-label="All pages (G)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7.5" height="16"/><rect x="13.5" y="4" width="7.5" height="16"/></svg>
    <span>Index</span>
  </button>
  <div class="counter"><span id="folio">1</span><span class="sep">/</span><span id="total">32</span></div>
  <button id="zoom-btn" class="btn" aria-label="Zoom (Z)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5M11 8.5v5"/></svg>
    <span>Zoom</span>
  </button>
  <button id="full-btn" class="btn" aria-label="Fullscreen (F)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span>Full</span>
  </button>
</footer>

<div id="grid" class="overlay grid" hidden>
  <button class="overlay__close" data-close aria-label="Close index">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <div class="grid__inner" id="grid-inner"></div>
</div>

<div id="lens" class="overlay lens" hidden>
  <button class="overlay__close" data-close aria-label="Close zoom">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <div class="lens__frame" id="lens-frame">
    <img id="lens-img" alt="" draggable="false">
  </div>
  <div class="lens__hint">Drag to pan · scroll to zoom · double-click to fit · Esc to close</div>
</div>

<noscript><p class="noscript">This viewer needs JavaScript. <a href="pages/view/01.webp">View the pages directly</a>.</p></noscript>

<script src="assets/book.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
