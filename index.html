<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kenny vo.</title>
<meta name="description" content="photography and selected work, read as spreads.">
<meta name="theme-color" content="#101010">
<meta property="og:title" content="kenny vo.">
<meta property="og:description" content="photography and selected work, read as spreads.">
<meta property="og:image" content="photography/pages/social.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23101010'/><rect x='6' y='7' width='9' height='18' fill='%23f2f0ec'/><rect x='17' y='7' width='9' height='18' fill='%23f2f0ec'/></svg>">
<style>
  :root{
    --bg:#0e0e0e; --bg-lift:#171717; --ink:#f2f0ec; --ink-dim:#8d8a85; --accent:#5f60ec;
    --serif:"Times New Roman", Times, serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; display:grid; place-items:center;
    padding:clamp(24px,6vw,64px);
    background:radial-gradient(120% 100% at 50% 0%, var(--bg-lift), var(--bg) 70%);
    color:var(--ink); font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
  }
  .shelf{ width:min(620px,100%); }
  h1{
    font-size:15px; font-weight:400; letter-spacing:.04em;
    margin:0 0 clamp(28px,5vh,44px);
  }
  h1 em{ font-style:italic; color:var(--ink-dim); margin-left:.4em; }
  ul{ list-style:none; margin:0; padding:0; }
  li + li{ margin-top:2px; }
  a.book{
    display:flex; align-items:baseline; gap:.75em;
    padding:16px 4px; text-decoration:none; color:var(--ink);
    border-top:1px solid rgba(255,255,255,.12);
    transition:color .18s ease, padding-left .18s ease;
  }
  li:last-child a.book{ border-bottom:1px solid rgba(255,255,255,.12); }
  a.book:hover, a.book:focus-visible{ color:var(--accent); padding-left:10px; outline:none; }
  .name{ font-size:19px; letter-spacing:.01em; }
  .meta{ margin-left:auto; font-size:11px; letter-spacing:.1em; color:var(--ink-dim); }
  a.book:hover .meta{ color:var(--accent); }
  footer{ margin-top:clamp(28px,5vh,44px); font-size:11px; letter-spacing:.06em; color:var(--ink-dim); }
  footer a{ color:inherit; }
  @media (prefers-reduced-motion:reduce){ *{ transition-duration:.01ms !important; } }
</style>
</head>
<body>
<main class="shelf">
  <h1>kenny vo. <em>two books, read as spreads</em></h1>
  <ul>
    <li><a class="book" href="photography/"><span class="name">photography.</span><span class="meta">32 pages</span></a></li>
    <li><a class="book" href="work/"><span class="name">work samples.</span><span class="meta">8 spreads</span></a></li>
  </ul>
  <footer><a href="mailto:tsukinomekv@gmail.com">tsukinomekv@gmail.com</a></footer>
</main>
</body>
</html>
