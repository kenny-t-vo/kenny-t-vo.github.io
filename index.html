  body{

  .card{
    width:min(430px,100%);

    font:400 var(--t1)/1.06 var(--display);
    letter-spacing:-.012em;
    margin:-0.201em 0 var(--s4);
  }

  .book{
    font:400 var(--t2)/1.35 var(--display);
    letter-spacing:.004em;
    padding:var(--s1) 0;
  }

  .elsewhere{
    display:flex; flex-direction:column; align-items:flex-start;
    margin-top:var(--s5);   /* wider than the title gap, so the books group reads as one */
    font-size:var(--t4);
    line-height:1.9;
  }

  footer{
    align-self:end;
    width:min(430px,100%);
    margin:0 auto;
    font-size:var(--t6);
    letter-spacing:.09em;
    color:var(--faint);
  }

  @media (max-height:480px){
    body{ padding-top:var(--s4); }
    h1{ margin-bottom:var(--s3); }
    .elsewhere{ margin-top:var(--s3); }
